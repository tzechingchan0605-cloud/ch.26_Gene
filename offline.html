<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gene Lab</title><style>:root{font-family:system-ui,sans-serif;color:#163b3b;background:#f1f5f2;font-size:16px}*{box-sizing:border-box}body{margin:0}header{padding:20px 4%;background:#103f3b;color:white;display:flex;align-items:center;justify-content:space-between;gap:16px}header h1{margin:0;font-size:24px}header small{color:#bdd6cd}.languages{display:flex;flex-shrink:0}button,select,input,textarea{font:inherit}button,select{padding:10px 13px;border:1px solid #b6ccc3;border-radius:8px;background:white;color:#163b3b;cursor:pointer}button:hover{background:#e0eee7}button[aria-pressed=true],.primary{background:#cbea7c;color:#183c32}button:disabled{opacity:.45;cursor:default}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}main{max-width:1400px;margin:auto;padding:0 4% 36px}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px}.intro h2{font-size:32px;margin-bottom:6px}.muted{color:#57736a}section,aside{background:#fff;border:1px solid #d4e0d9;border-radius:16px;padding:22px;margin:16px 0} .workspace{display:grid;grid-template-columns:280px 1fr;gap:20px}.controls label{display:block;margin:16px 0 8px}.controls select{width:100%}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.organisms{display:flex;justify-content:space-around;align-items:center;gap:12px;text-align:center}.parent{padding:18px;background:#f2f7f2;border-radius:16px;min-width:30%}.alleles{font-size:28px;letter-spacing:3px;font-weight:650;margin:16px 0}.gametes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.gamete{display:inline-flex;border:2px solid #528d7a;border-radius:50%;padding:12px;min-width:48px;justify-content:center}.offspring{border:2px dashed #b0bf84;text-align:center;padding:20px;margin-top:22px;border-radius:16px;background:#fbfced;min-height:125px}.offspring strong{font-size:32px}.results{display:grid;grid-template-columns:1fr 1fr;gap:20px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}th,td{padding:10px;border-bottom:1px solid #dde7e1}thead{background:#f1f6f2}.square td,.square th{text-align:center;border:1px solid #dce6df}.bar{height:9px;background:#337e6b;margin:5px 0}.observed{background:repeating-linear-gradient(90deg,#8b9a38 0 6px,#c9d78d 6px 8px)}.legend{display:flex;gap:16px;font-size:13px}.legend span:before{content:'━ ';font-weight:bold;color:#337e6b}.legend span:last-child:before{content:'▧ ';color:#8b9a38}.notice{border-left:4px solid #8b9a38;padding:12px;background:#f4f7e9}textarea{width:100%;min-height:80px;border:1px solid #abc3b7;border-radius:8px;padding:12px}summary{cursor:pointer;font-weight:600}dt{font-weight:600}dd{margin:4px 0 12px}.pulse{animation:appear .35s ease}@keyframes appear{from{transform:scale(.92);opacity:.5}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:850px){.workspace,.results{grid-template-columns:1fr}.intro{align-items:start;flex-direction:column}header{align-items:start;flex-wrap:wrap}.parent{padding:12px}.alleles{font-size:22px}}:focus-visible{outline:3px solid #c59829;outline-offset:3px}

</style></head><body><div id="app"></div><script>const options={mono:['TT','Tt','tt'],test:['unknown'],di:['RRYY','RRYy','RRyy','RrYY','RrYy','Rryy','rrYY','rrYy','rryy'],abo:['IᴬIᴬ','Iᴬi','IᴮIᴮ','Iᴮi','IᴬIᴮ','ii'],sex:['XX'],x:['XᴳXᴳ','XᴳXᵍ','XᵍXᵍ']};
function gametes(mode,g){if(mode==='abo')return g.match(/Iᴬ|Iᴮ|i/g);if(mode==='x')return g.match(/Xᴳ|Xᵍ|Y/g);if(mode==='sex')return [...g];if(mode==='di')return [g[0]+g[2],g[0]+g[3],g[1]+g[2],g[1]+g[3]];return [...g];}
const pair=(a,b)=>[a,b].sort((x,y)=>x===y?0:x===x.toUpperCase()?-1:1).join('');
function combine(mode,a,b){if(mode==='di')return pair(a[0],b[0])+pair(a[1],b[1]);if(mode==='abo')return [a,b].sort((x,y)=>['Iᴬ','Iᴮ','i'].indexOf(x)-['Iᴬ','Iᴮ','i'].indexOf(y)).join('');if(mode==='x')return [a,b].sort((x,y)=>['Xᴳ','Xᵍ','Y'].indexOf(x)-['Xᴳ','Xᵍ','Y'].indexOf(y)).join('');return pair(a,b);}
function phenotype(m,g){if(m==='abo')return g.includes('Iᴬ')?(g.includes('Iᴮ')?'AB':'A'):g.includes('Iᴮ')?'B':'O';if(m==='sex')return g==='XX'?'xx':'xy';if(m==='x')return g.includes('Y')?(g.includes('ᵍ')?'affectedSon':'unaffectedSon'):g==='XᵍXᵍ'?'affectedDaughter':g.includes('ᵍ')?'carrierDaughter':'unaffectedDaughter';if(m==='di')return (g.includes('R')?'round':'wrinkled')+(g.includes('Y')?'Yellow':'Green');return g.includes('T')?'tall':'short';}
function outcomes(mode,p,q){const a=gametes(mode,p),b=gametes(mode,q),gen={},phen={};for(const x of a)for(const y of b){let g=combine(mode,x,y),f=phenotype(mode,g);gen[g]=(gen[g]||0)+1/(a.length*b.length);phen[f]=(phen[f]||0)+1/(a.length*b.length);}return {gen,phen};}
function rng(seed){let s=seed>>>0;return ()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
function draw(mode,p,q,random){const a=gametes(mode,p),b=gametes(mode,q);let x=a[Math.floor(random()*a.length)],y=b[Math.floor(random()*b.length)];return {a:x,b:y,g:combine(mode,x,y)};}

],observed:['觀察比例','Observed proportion'],count:['觀察數目','Observed count'],evidence:['本輪證據','Current evidence'],total:['子代總數','Total offspring'],save:['儲存本輪以比較','Save run for comparison'],saved:['已儲存批次（設定與結果固定）','Saved batches (fixed settings and results)'],noSaved:['尚未儲存批次','No saved batches yet'],export:['下載 CSV','Download CSV'],model:['模型資訊與假設','Model information & assumptions'],assumptions:['模擬資料，並非實測數據。每次受精獨立；配子等機會抽樣。完全顯性；雙基因模型假設獨立分配。XX／XY 與 G6PD 符號僅為課本式簡化模型，不涵蓋所有性或性別情況。Y 不帶此 X 連鎖等位基因。大樣本整體較接近理論，但任何一次大樣本不保證更接近。','Simulated, not measured data. Fertilisations are independent with equally likely gamete slots. Complete dominance; dihybrid loci assort independently. XX/XY and G6PD symbols are simplified textbook-style models, not a complete account of sex or gender. Y carries no allele at this X-linked locus. Larger samples tend to approach theory overall; any single larger sample is not guaranteed to be closer.'],source:['依據提供的規格及詞彙；未提供課本 PDF，未核對頁碼或 EDB 文件。','Based on the supplied specification and glossary. No textbook PDF was supplied; page references and EDB documents have not been verified.'],seed:['隨機種子','Random seed'],hidden:['未知親代基因型已隱藏','Unknown parental genotype hidden'],revealUnknown:['揭示未知親代','Reveal unknown parent'],testEvidence:['出現矮莖子代可排除 TT；有限次全為高莖支持但不能證明 TT。請將證據與自己的推論分開。','A short offspring rules out TT. A finite all-tall sample supports but cannot prove TT. Keep evidence separate from your inference.'],excluded:['已觀察矮莖：排除 TT。','Short offspring observed: TT ruled out.'],uncertain:['尚未觀察矮莖：仍不能證明 TT。','No short offspring observed: TT is not proven.'],xnote:['XᴳXᵍ × XᴳY：患病佔兒子 50%，佔所有子代 25%。父方把 Y 傳給兒子，不把 X 傳給兒子。','XᴳXᵍ × XᴳY: 50% of sons, 25% of all offspring are affected. A father passes Y, not X, to a son.'],abonote:['群體有三種等位基因，每人有兩個。A 可為 IᴬIᴬ 或 Iᴬi；B 可為 IᴮIᴮ 或 Iᴮi。AB 為等顯性。','Three alleles in the population; two in each person. A may be IᴬIᴬ or Iᴬi; B may be IᴮIᴮ or Iᴮi. AB shows codominance.'],dinote:['只有 RrYy × RrYy 在本模型的假設下有 9:3:3:1 表現型比例。','The 9:3:3:1 phenotype ratio applies only to RrYy × RrYy under these assumptions.'],challenge:['預測 → 操作 → 觀察 → 解釋','Predict → operate → observe → explain'],explain:['記錄你的解釋（不自動評分）','Record your explanation (not automatically marked)'],hint:['逐步提示','Step-by-step hint'],hint1:['先把親代等位基因分開，列出每一種配子。','Separate the parental alleles and list the gametes.'],hint2:['每個方格代表一種配子組合；相同基因型合併計數。','Each cell is a gamete combination; combine identical genotypes.'],questions:['Tt × Tt 的基因型與表現型比例？|小樣本為何不一定是 3:1？|要分辨 TT 與 Tt，應選哪個測交親代？|前三個子代皆高莖，第四個必為矮莖嗎？|A 型與 B 型親代生出 O 型子代，可推論甚麼？|患病佔兒子與佔所有子代的機率有何分別？','What are the genotype and phenotype ratios for Tt × Tt?|Why might a small sample differ from 3:1?|Which tester distinguishes TT from Tt?|If the first three offspring are tall, must the fourth be short?|What can you infer if parents with A and B blood groups have an O child?|How do probabilities among sons and among all offspring differ?'],answers:['1:2:1；3:1。|每次受精獨立，隨機抽樣可偏離理論比例。|選 tt；出現矮莖可排除 TT。|不一定；下一個仍有 3/4 機會高莖（Tt × Tt）。|兩人皆帶 i，即 Iᴬi 與 Iᴮi。|XᴳXᵍ × XᴳY：兒子中 1/2；所有子代中 1/4。','1:2:1; 3:1.|Independent random sampling can deviate from theoretical ratios.|Use tt; a short offspring rules out TT.|No; the next still has a 3/4 chance of being tall (Tt × Tt).|Both carry i: Iᴬi and Iᴮi.|XᴳXᵍ × XᴳY: 1/2 of sons; 1/4 of all offspring.'],choose:['選擇挑戰','Choose a challenge'],glossary:['雙語詞彙','Bilingual glossary'],unit:['個（模擬子代）','individuals (simulated offspring)'],row:['批次','Batch']};
const glossary={'基因':'gene','等位基因':'allele','基因型':'genotype','表現型':'phenotype','顯性':'dominant','隱性':'recessive','純合子':'homozygote','雜合子':'heterozygote','配子':'gamete','分離定律':'law of segregation','獨立分配定律':'law of independent assortment','單基因雜種雜交':'monohybrid cross','雙基因雜種雜交':'dihybrid cross','測交':'test cross','龐氏表':'Punnett square','多等位基因':'multiple alleles','等顯性':'codominance','性連鎖':'sex linkage','帶基因者':'carrier','譜系':'pedigree'};

const languageStore={get(){try{return localStorage.getItem('gene-language');}catch{return null;}},set(value){try{localStorage.setItem('gene-language',value);}catch{}}};
let lang=languageStore.get()==='en'?1:0;
const t=k=>dictionary[k]?.[lang]??k,esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>crypto.getRandomValues(new Uint32Array(1))[0];
let s={mode:'mono',p:'Tt',q:'Tt',seed:seed(),hidden:seed()%2?'TT':'Tt',revealUnknown:false,labels:true,guided:false,revealed:true,prediction:'',explanation:'',question:0,hints:0,counts:{},n:0,last:null,speed:600,history:[],saved:[]},random=rng(s.seed),timer=null;
const parents=()=>s.mode==='test'?[s.hidden,'tt']:[s.p,s.q], m=()=>s.mode==='test'?'mono':s.mode;
function stop(){clearInterval(timer);timer=null;}
function reset(fresh=false){stop();if(fresh){s.seed=seed();if(s.mode==='test')s.hidden=seed()%2?'TT':'Tt';s.revealUnknown=false;}random=rng(s.seed);s.counts={};s.n=0;s.last=null;s.history=[];}
function run(n){let [p,q]=parents();for(let i=0;i<n;i++){s.last=draw(m(),p,q,random);s.counts[s.last.g]=(s.counts[s.last.g]||0)+1;s.n++;}s.history.push(n);render();}
const btn=(id,label,extra='')=>`<button id="${id}" ${extra}>${esc(t(label))}</button>`;
function select(id,vals,val){return `<select id="${id}">${vals.map(x=>`<option ${x===val?'selected':''} value="${esc(x)}">${esc(x==='unknown'?t('unknown'):x)}</option>`).join('')}</select>`;}
function table(theory,counts,total,kind){return `<table><thead><tr><th>${t(kind)}</th><th>${t('theory')}</th><th>${t('count')}</th><th>${t('observed')}</th></tr></thead><tbody>${Object.entries(theory).map(([k,v])=>`<tr><th>${esc(t(k))}</th><td>${(v*100).toFixed(1)}%<div class="bar" style="width:${v*100}%"></div></td><td>${counts[k]||0}</td><td>${total?((counts[k]||0)/total*100).toFixed(1)+'%':'—'}<div class="bar observed" style="width:${total?(counts[k]||0)/total*100:0}%"></div></td></tr>`).join('')}</tbody></table>`;}
function observedPhen(counts,mode){let r={};for(let [g,n] of Object.entries(counts)){let f=phenotype(mode,g);r[f]=(r[f]||0)+n;}return r;}
function render(){let [p,q]=parents(),mode=m(),theory=outcomes(mode,p,q),hide=s.guided&&!s.revealed,conceal=s.mode==='test'&&!s.revealUnknown;document.documentElement.lang=lang?'en-GB':'zh-HK';document.title=t('title');let ga=gametes(mode,p),gb=gametes(mode,q);
document.querySelector('#app').innerHTML=`<header><div><h1>${t('title')}</h1><small>${t('subtitle')}</small></div><div class="languages" role="group" aria-label="繁體中文 | English"><button id="zh" aria-pressed="${!lang}">繁體中文</button><button id="en" aria-pressed="${!!lang}">English</button></div></header><main><div class="intro"><div><h2>${t('intro')}</h2><p class="muted">${t('lead')}</p></div><div class="actions">${btn('explore','explore',`aria-pressed="${!s.guided}"`)}${btn('guided','guided',`aria-pressed="${s.guided}"`)}</div></div><nav>${Object.keys(options).map(k=>btn('mode-'+k,k,`aria-pressed="${s.mode===k}"`)).join('')}</nav>
${s.guided?`<section><h3>${t('challenge')}</h3><label for="question">${t('choose')}</label>${select('question',t('questions').split('|').map((_,i)=>String(i)),String(s.question))}<p>${esc(t('questions').split('|')[s.question])}</p><label for="prediction">${t('prediction')}</label><textarea id="prediction">${esc(s.prediction)}</textarea><div class="actions">${btn('attempt','attempt')}${btn('reveal','reveal')}${btn('hint','hint')}</div>${s.hints?`<p>${t('hint1')}</p>`:''}${s.hints>1?`<p>${t('hint2')}</p>`:''}${s.revealed?`<p class="notice">${esc(t('answers').split('|')[s.question])}</p>`:''}<label for="explanation">${t('explain')}</label><textarea id="explanation">${esc(s.explanation)}</textarea></section>`:''}
<div class="workspace"><aside class="controls"><h3>${t('parents')}</h3><label for="p">${t('p')}</label>${select('p',options[s.mode],s.mode==='test'?'unknown':s.p)}<label for="q">${t('q')}</label>${select('q',s.mode==='test'?['tt']:s.mode==='sex'?['XY']:s.mode==='x'?['XᴳY','XᵍY']:options[s.mode],q)}<div class="actions">${btn('labels','labels',`aria-pressed="${s.labels}"`)}</div><label for="speed">${t('speed')}</label><select id="speed"><option value="600" ${s.speed===600?'selected':''}>${t('normal')}</option><option value="1600" ${s.speed===1600?'selected':''}>${t('slow')}</option></select><div class="actions">${btn('play',timer?'pause':'play')}${btn('step','step')}</div><div class="actions">${btn('reset','reset')}${btn('replay','replay')}${btn('new','newRun')}</div></aside><section><h3>${t(s.mode)}</h3><div class="organisms">${[[p,ga,'p'],[q,gb,'q']].map(([g,gs,k])=>`<div class="parent">${s.labels?t(k):''}<div class="alleles">${conceal&&k==='p'?'? ?':esc(g)}</div>${s.labels?t('gametes'):''}<div class="gametes">${conceal&&k==='p'?'<span class="gamete">?</span>':[...new Set(gs)].map(a=>`<span class="gamete ${s.last&&a===(k==='p'?s.last.a:s.last.b)?'selected':''}">${esc(a)}</span>`).join('')}</div></div>`).join('<span aria-hidden="true">×</span>')}</div><div class="offspring ${s.last?'pulse':''}" role="status">${t('offspring')}<br>${s.last?`<p><span class="gamete">${s.last.a}</span> + <span class="gamete">${s.last.b}</span> → <strong>${s.last.g}</strong></p>${t('genotype')}: ${s.last.g} · ${t('phenotype')}: ${t(phenotype(mode,s.last.g))}`:`<p>${t('empty')}</p>`}</div><div class="actions">${btn('run-1','one','class="primary"')}${[10,100,1000].map(n=>`<button id="run-${n}">${n} ${t('batch')}</button>`).join('')}${btn('save','save',s.n?'':'disabled')}</div>${s.mode==='test'?`<p class="notice">${t('testEvidence')}</p><p>${t(s.counts.tt?'excluded':'uncertain')}</p>${btn('unknown','revealUnknown')} ${s.revealUnknown?esc(s.hidden):t('hidden')}`:''}${s.mode==='abo'?`<p class="notice">${t('abonote')}</p>`:''}${s.mode==='di'?`<p class="notice">${t('dinote')}</p>`:''}${s.mode==='x'?`<p class="notice">${t('xnote')}</p>`:''}</section></div>
<div class="results"><section><h3>${t('square')}</h3>${hide?btn('show','reveal'):conceal?`<p>${t('hidden')}</p>`:`<div class="scroll"><table class="square"><thead><tr><th>×</th>${gb.map(a=>`<th>${a}</th>`).join('')}</tr></thead><tbody>${ga.map(a=>`<tr><th>${a}</th>${gb.map(b=>`<td>${combine(mode,a,b)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}</section><section><h3>${t('evidence')} · ${s.n} ${t('unit')}</h3><div class="legend"><span>${t('theory')}</span><span>${t('observed')}</span></div>${hide||conceal?`<p>${t(conceal?'hidden':'prediction')}</p><table><tr><th>${t('genotype')}</th><th>${t('count')}</th></tr>${Object.entries(s.counts).map(([g,n])=>`<tr><td>${g}</td><td>${n}</td></tr>`).join('')}</table>`:table(theory.gen,s.counts,s.n,'genotype')+table(theory.phen,observedPhen(s.counts,mode),s.n,'phenotype')}</section></div>
<section><h3>${t('saved')}</h3>${btn('export','export',s.saved.length?'':'disabled')}${s.saved.length?s.saved.map((r,i)=>`<details><summary>${t('row')} ${i+1} · ${t(r.module)} · ${r.concealed?'?':r.p} × ${r.q} · ${r.n} ${t('unit')}</summary>${r.concealed?`<p>${t('hidden')}</p><button id="saved-reveal-${i}">${t('revealUnknown')}</button><table>${Object.entries(r.counts).map(([g,n])=>`<tr><td>${g}</td><td>${n}</td></tr>`).join('')}</table>`:table(r.theory.gen,r.counts,r.n,'genotype')+table(r.theory.phen,observedPhen(r.counts,r.mode),r.n,'phenotype')}</details>`).join(''):`<p>${t('noSaved')}</p>`}</section>
<section><details><summary>${t('model')}</summary><p>${t('assumptions')}</p><p>${t('source')}</p><p>${t('seed')}: ${s.seed}</p></details></section><section><details><summary>${t('glossary')}</summary><dl>${Object.entries(glossary).map(([zh,en])=>`<dt>${lang?en:zh}</dt><dd>${lang?zh:en}</dd>`).join('')}</dl></details></section></main>`;
const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
on('zh',()=>{lang=0;languageStore.set('zh');render();});on('en',()=>{lang=1;languageStore.set('en');render();});for(let k of Object.keys(options))on('mode-'+k,()=>{s.mode=k;s.p=k==='mono'?'Tt':k==='test'?'unknown':k==='di'?'RrYy':k==='abo'?'Iᴬi':k==='sex'?'XX':'XᴳXᵍ';s.q=k==='test'?'tt':k==='sex'?'XY':k==='x'?'XᴳY':k==='abo'?'Iᴮi':s.p;reset(true);s.revealed=!s.guided;render();});
for(let k of ['p','q'])document.getElementById(k).onchange=e=>{s[k]=e.target.value;reset();s.revealed=!s.guided;render();};
on('explore',()=>{s.guided=false;s.revealed=true;render();});on('guided',()=>{s.guided=true;s.revealed=false;render();});on('labels',()=>{s.labels=!s.labels;render();});for(let n of [1,10,100,1000])on('run-'+n,()=>run(n));on('step',()=>run(1));on('reset',()=>{reset();render();});on('new',()=>{reset(true);render();});on('replay',()=>{let history=[...s.history];reset();for(let n of history)run(n);render();});on('play',()=>{if(timer)stop();else timer=setInterval(()=>run(1),s.speed);render();});document.getElementById('speed').onchange=e=>{s.speed=Number(e.target.value);if(timer){stop();timer=setInterval(()=>run(1),s.speed);}};
on('unknown',()=>{s.revealUnknown=true;render();});for(let id of ['attempt','reveal','show'])on(id,()=>{if(id==='attempt'&&!s.prediction.trim()){document.getElementById('prediction').focus();return;}s.revealed=true;render();});on('hint',()=>{s.hints++;render();});for(let k of ['prediction','explanation']){let el=document.getElementById(k);if(el)el.oninput=e=>s[k]=e.target.value;}let qe=document.getElementById('question');if(qe)qe.onchange=e=>{s.question=Number(e.target.value);s.revealed=false;s.hints=0;render();};
on('save',()=>{s.saved.push(structuredClone({module:s.mode,mode,p,q,n:s.n,counts:s.counts,theory,seed:s.seed,concealed:conceal,prediction:s.prediction,explanation:s.explanation}));render();});on('export',exportCSV);s.saved.forEach((r,i)=>on('saved-reveal-'+i,()=>{r.concealed=false;render();}));
}
function exportCSV(){let rows=[[t('row'),t('parents'),t('seed'),t('total'),t('genotype')+' / '+t('phenotype'),t('count'),t('theory'),t('model'),t('prediction'),t('explain')]];s.saved.forEach((r,i)=>Object.entries(r.theory.gen).forEach(([g,v])=>rows.push([i+1,r.p+' × '+r.q,r.seed,r.n,g,r.counts[g]||0,v,t('assumptions'),r.prediction,r.explanation])));s.saved.forEach((r,i)=>Object.entries(r.theory.phen).forEach(([f,v])=>rows.push([i+1,r.p+' × '+r.q,r.seed,r.n,t(f),observedPhen(r.counts,r.mode)[f]||0,v,t('assumptions'),r.prediction,r.explanation])));let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+(/^[=+@\-]/.test(String(v))?String.fromCharCode(39)+String(v):String(v)).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=lang?'inheritance-runs.csv':'遺傳模擬批次.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
render();
</script></body></html>
